<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Labib Enterprise</title>
        <link rel="stylesheet" href="./css/style.css" />

        <link rel="stylesheet" href="./bootstrap-v5.3/css/bootstrap.min.css" />
    </head>
    <body>
        <header class="container-fluid fixed-top">
            <nav class="navbar navbar-expand-lg navbar-dark">
                <div class="container-fluid navbar-inner">
                    <a class="navbar-brand" href="./asset/img/labib-logo.png"
                        ><img
                            src="./asset/img/labib-logo.png"
                            alt="Labib-logo"
                            width="30"
                            height="24"
                        />
                        Labib Enterprise</a
                    >
                    <button
                        class="navbar-toggler"
                        type="button"
                        data-bs-toggle="collapse"
                        data-bs-target="#navbarNavDropdown"
                        aria-controls="navbarNavDropdown"
                        aria-expanded="false"
                        aria-label="Toggle navigation"
                    >
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div
                        class="collapse navbar-collapse"
                        id="navbarNavDropdown"
                    >
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a
                                    class="nav-link active"
                                    aria-current="page"
                                    href="#"
                                    >Home</a
                                >
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Features</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Pricing</a>
                            </li>
                            <li class="nav-item dropdown">
                                <a
                                    class="nav-link dropdown-toggle"
                                    href="#"
                                    id="navbarDropdownMenuLink"
                                    role="button"
                                    data-bs-toggle="dropdown"
                                    aria-expanded="false"
                                >
                                    Dropdown link
                                </a>
                                <ul
                                    class="dropdown-menu"
                                    aria-labelledby="navbarDropdownMenuLink"
                                >
                                    <li>
                                        <a class="dropdown-item" href="#"
                                            >Action</a
                                        >
                                    </li>
                                    <li>
                                        <a class="dropdown-item" href="#"
                                            >Another action</a
                                        >
                                    </li>
                                    <li>
                                        <a class="dropdown-item" href="#"
                                            >Something else here</a
                                        >
                                    </li>
                                </ul>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </header>

        <section id="billboard" class="position-relative overflow-hidden">
            <div
                id="carouselExampleControls"
                class="carousel slide"
                data-bs-ride="carousel"
            >
                <div class="carousel-inner h-100">
                    <div class="carousel-item active">
                        <img
                            src="./asset/img/figma/Background-clean.png"
                            class="d-block w-100"
                            alt="hero"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src="./asset/img/figma/Background-clean-02.png"
                            class="d-block w-100"
                            alt="hero-02"
                        />
                    </div>
                    <div class="carousel-item">
                        <img
                            src="./asset/img/figma/Background-clean-03.png"
                            class="d-block w-100"
                            alt="hero-03"
                        />
                    </div>
                </div>
                <button
                    class="carousel-control-prev"
                    type="button"
                    data-bs-target="#carouselExampleControls"
                    data-bs-slide="prev"
                >
                    <span
                        class="carousel-control-prev-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button
                    class="carousel-control-next"
                    type="button"
                    data-bs-target="#carouselExampleControls"
                    data-bs-slide="next"
                >
                    <span
                        class="carousel-control-next-icon"
                        aria-hidden="true"
                    ></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>
        </section>
        <script src="./bootstrap-v5.3/js/bootstrap.min.js"></script>
    </body>
</html>
